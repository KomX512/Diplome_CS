version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cloudstorage
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 159753
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cloudstorage
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: 159753
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
