server:
  port: 8080
  servlet:
    context-path: /cloud

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cloudstorage
    username: admin
    password: 159753

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

app:
  cors:
    allowed-origins: "http://localhost:8080,http://localhost:8081"
